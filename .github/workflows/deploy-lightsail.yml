name: Deploy to Amazon Lightsail

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 1. COMPILAR EL BACKEND (JAVA) ---
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew
        
      - name: Build Backend with Gradle
        working-directory: ./backend
        run: ./gradlew clean build -x test

      # --- 2. COMPILAR EL FRONTEND (REACT/VITE) ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies and Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      # --- 3. TRANSFERIR ARCHIVOS A LIGHTSAIL (SCP) ---
      - name: Copy files to Lightsail via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "backend/build/libs/*.jar,frontend/dist/*"
          target: "/home/${{ secrets.LIGHTSAIL_USERNAME }}/marketprime-deploy"
          strip_components: 0

      # --- 4. REINICIAR SERVICIOS EN EL SERVIDOR (SSH) ---
      - name: Restart Services on Lightsail via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            echo "Archivos subidos exitosamente a ~/marketprime-deploy/"
            
            # 1. Copiar el Frontend a la carpeta web específica de MarketPrime
            sudo mkdir -p /var/www/marketprime/html
            sudo cp -r ~/marketprime-deploy/frontend/dist/* /var/www/marketprime/html/
            
            # Asegurar permisos correctos para Nginx
            sudo chown -R www-data:www-data /var/www/marketprime/html
            
            # 2. Detener el proceso Java antiguo que esté ocupando el puerto 8081
            echo "Deteniendo proceso antiguo..."
            sudo fuser -k 8081/tcp || echo "No hay proceso en el puerto 8081."
            
            # 3. Iniciar el nuevo proceso en segundo plano (nohup)
            echo "Iniciando nuevo proceso..."
            export SPRING_PROFILES_ACTIVE=prod
            nohup java -jar ~/marketprime-deploy/backend/build/libs/*SNAPSHOT.jar > ~/marketprime-deploy/backend/backend.log 2>&1 &
            
            echo "Despliegue finalizado. El backend está corriendo en el puerto 8081."
