name: Deploy to Amazon Lightsail

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 1. COMPILAR EL BACKEND (JAVA) ---
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew
        
      - name: Build Backend with Gradle
        working-directory: ./backend
        run: ./gradlew clean build -x test

      # --- 2. COMPILAR EL FRONTEND (REACT/VITE) ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies and Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      # --- 3. TRANSFERIR ARCHIVOS A LIGHTSAIL (SCP) ---
      - name: Copy files to Lightsail via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "backend/build/libs/*.jar,frontend/dist/*"
          target: "/home/${{ secrets.LIGHTSAIL_USERNAME }}/marketprime-deploy"
          strip_components: 0

      # --- 4. REINICIAR SERVICIOS EN EL SERVIDOR (SSH) ---
      - name: Restart Services on Lightsail via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            echo "Archivos subidos exitosamente a ~/marketprime-deploy/"
            
            # ATENCIÓN: Estos comandos dependen de cómo configuraste tu servidor.
            # 1. Copiar el Frontend a la carpeta de Nginx/Apache (Ej: /var/www/html)
            # sudo cp -r ~/marketprime-deploy/frontend/dist/* /var/www/html/
            
            # 2. Reiniciar el Backend. Si usas systemd (Ej: marketprime.service):
            # sudo systemctl restart marketprime.service
            
            # O si usas nohup (ejemplo genérico):
            # pkill -f 'java -jar' || true
            # nohup java -jar ~/marketprime-deploy/backend/build/libs/marketprime-0.0.1-SNAPSHOT.jar > backend.log 2>&1 &
            
            echo "Despliegue finalizado. Por favor ajusta los comandos de reinicio en .github/workflows/deploy-lightsail.yml si es necesario."
