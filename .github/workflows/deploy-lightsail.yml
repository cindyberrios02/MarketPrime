name: Deploy to Amazon Lightsail

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 1. COMPILAR EL BACKEND (JAVA) ---
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew
        
      - name: Build Backend with Gradle
        working-directory: ./backend
        run: ./gradlew clean build -x test

      # --- 2. COMPILAR EL FRONTEND (REACT/VITE) ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies and Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      # --- 3. TRANSFERIR ARCHIVOS A LIGHTSAIL (SCP) ---
      - name: Copy files to Lightsail via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "backend/build/libs/*.jar,frontend/dist/*"
          target: "/home/${{ secrets.LIGHTSAIL_USERNAME }}/marketprime-deploy"
          strip_components: 0

      # --- 4. REINICIAR SERVICIOS EN EL SERVIDOR (SSH) ---
      - name: Restart Services on Lightsail via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          DB_USER: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          DB_PASS: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: DB_URL,DB_USER,DB_PASS,AWS_KEY,AWS_SECRET
          script: |
            echo "Archivos subidos exitosamente a ~/marketprime-deploy/"
            
            # 1. Copiar el Frontend a la carpeta web específica de MarketPrime
            sudo mkdir -p /var/www/marketprime/html
            sudo cp -r ~/marketprime-deploy/frontend/dist/* /var/www/marketprime/html/
            
            # Asegurar permisos correctos para Nginx
            sudo chown -R www-data:www-data /var/www/marketprime/html
            
            # 2. Detener el proceso Java antiguo que esté ocupando el puerto 8081
            echo "Deteniendo proceso antiguo..."
            sudo fuser -k 8081/tcp || echo "No hay proceso en el puerto 8081."
            
            # 3. Iniciar el nuevo proceso inyectando las variables de entorno de forma segura
            echo "Iniciando nuevo proceso..."
            export SPRING_PROFILES_ACTIVE=prod
            export SPRING_DATASOURCE_URL="$DB_URL"
            export SPRING_DATASOURCE_USERNAME="$DB_USER"
            export SPRING_DATASOURCE_PASSWORD="$DB_PASS"
            export AWS_ACCESS_KEY_ID="$AWS_KEY"
            export AWS_SECRET_ACCESS_KEY="$AWS_SECRET"
            
            echo "DEBUG: SPRING_DATASOURCE_URL es: $SPRING_DATASOURCE_URL"
            echo "DEBUG: Largo de SPRING_DATASOURCE_URL: ${#SPRING_DATASOURCE_URL} caracteres"
            echo "DEBUG: Largo del PASSWORD inyectado: ${#SPRING_DATASOURCE_PASSWORD} caracteres"
            
            nohup java -jar ~/marketprime-deploy/backend/build/libs/*SNAPSHOT.jar > ~/marketprime-deploy/backend/backend.log 2>&1 &
            
            echo "Esperando 15 segundos para verificar si Java arranca sin errores..."
            sleep 15
            
            echo "--- ÚLTIMOS REGISTROS DE JAVA (backend.log) ---"
            cat ~/marketprime-deploy/backend/backend.log
            echo "-----------------------------------------------"
            
            echo "Despliegue finalizado. Revisa los logs arriba para ver si hay errores."
